name: Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18"
          rebar3-version: "3.27"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Gleam build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-gleam-build-${{ hashFiles('manifest.toml', 'gleam.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-build-

      - name: Cache Deno node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-deno-node_modules-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-node_modules-

      - name: Install dependencies
        run: |
          gleam deps download
          deno ci

      - name: Run test
        run: just test
